# Single source of truth for the program. scripts/build_sheet.py turns this into
# the Library tab of the Google Sheet. Edit here, rebuild, re-run Setup.
#
# Rules this file must satisfy (checked by tests/test_library.py):
#   - 6 training days per block, 1 Heavy + 4 accessories each
#   - Upper body: dumbbell, machine, cable, bodyweight or Smith machine only
#   - Legs: barbell allowed. No deadlift variants anywhere.
#   - Every exercise has exactly one how-to video URL.

kettlebell:
  title: "Roxanne Russell – 30 Min Full Body Kettlebell Workout (No Repeat)"
  url: ""  # filled by scripts/find_videos (verified)
  note: "Do the first 10–15 minutes as your warm-up."

types:
  Heavy:        {sets_note: "last set AMRAP", rest: "3–5 min"}
  Compound-acc: {rest: "2–3 min"}
  Isolation:    {rest: "60–90 s"}

days:
  # key, weekday (0 = Sun), label
  - [P1, 0, "Push 1"]
  - [PU1, 1, "Pull 1"]
  - [L1, 2, "Legs 1"]
  - [P2, 3, "Push 2"]
  - [PU2, 4, "Pull 2"]
  - [L2, 5, "Legs 2"]

# Each exercise: [name, type, sets, rep_low, rep_high, increment_lb, equipment, video_url]
# Region is implied by the day (P/PU = Upper, L = Legs).
