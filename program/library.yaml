# Suggested weight for week 1 of a block, by "day|order" (e.g. "P1|1" = Push 1, exercise 1A).
# After week 1 the weekly tab carries weights forward as before. Written by scripts/recalc.py
# at the end of each block (heavy lifts: the higher of last week's suggestion and 85% of the
# best AMRAP-estimated max, rounded down to 5 lb). Block D was seeded from weeks 1-3.
start_lb:
  D:
    P1|1: 145    # Smith flat bench: 135 x 9 AMRAP -> est. max 175.5 -> 85% = 145
    P1|2: 37.5
    P1|3: 50
    P1|4: 50
    P1|5: 115
    P1|6: 10
    PU1|1: 155   # Iso-lateral row: 145 x 8 -> est. max 183.7 -> 85% = 155
    PU1|3: 185
    PU1|4: 152.5
    PU1|5: 85
    PU1|6: 62.5
    L1|2: 200
    L1|3: 70
    L1|4: 290
    L1|5: 280
    P2|1: 135    # Smith incline: 135 x 4 -> est. max 153 -> 85% = 130, keep the higher 135
    P2|2: 62.5
    PU2|1: 165   # Smith row: 135 x 14 -> est. max 198 -> 85% = 165
    PU2|3: 54.5
    PU2|4: 80
    PU2|5: 75
    PU2|6: 37.5
