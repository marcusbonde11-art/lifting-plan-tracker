# Single source of truth for the program. scripts/build_sheet.py turns this into
# the Library tab of the Google Sheet. Edit here, rebuild, re-paste the Library tab.
#
# v2 (from week 4, Sun Nov 1 2026): 45-minute sessions = 15 min kettlebell + 30 min lifting,
# done as three supersets (1A/1B, 2A/2B, 3A/3B).
#
# Rules this file must satisfy (checked by tests/test_library.py and tests/test_timing.py):
#   - 6 training days per block, 6 exercises each = 3 supersets
#   - 1A is the heavy lift (4 x 3-5, last set AMRAP); everything else 3-4 x 8-12
#   - Belt Squat Machine is the heavy lift on both leg days in every block
#   - Upper body: dumbbell, machine, cable, bodyweight or Smith machine only
#   - Legs: barbell allowed. No deadlift variants anywhere.
#   - Every exercise has exactly one how-to video URL (< 4 min)
#   - Every day fits the 30-minute lifting cap (scripts/timing.py)

kettlebell:
  # One ~15-minute, beginner-friendly, male-led kettlebell warm-up per day type.
  # Push video runs on Push 1 + Push 2, pull on Pull 1 + Pull 2, legs on Legs 1 + Legs 2.
  push:
    title: "Samuel Jordan – Chest & Triceps with One Kettlebell (15 min)"
    url: "https://www.youtube.com/watch?v=SM7h3wih74M"   # 16:53
  pull:
    title: "DanielPT Fitness – 15 min Pull Upper Body Kettlebell (slow-paced)"
    url: "https://www.youtube.com/watch?v=Ic1Yoq7fe-o"   # 15:40
  legs:
    title: "DanielPT Fitness – 15 min Kettlebell Leg & Glute (all standing)"
    url: "https://www.youtube.com/watch?v=NZjsyOYaS1g"   # 15:26

# Time math (seconds unless noted). scripts/timing.py turns these into minutes per
# superset and per day; the weekly tab shows them.
timing:
  heavy_set: 30           # one heavy set of 3-5 reps
  set: 45                 # one set of 8-12 reps
  move: 15                # walk from the A station to the B station (set them up side by side)
  rest_after_round: [90, 45, 45]   # rest after each B set, superset 1 / 2 / 3
  ramp_up_min: 2          # two quick warm-up sets before the heavy lift
  between_supersets_min: 0.5
  cap_min: 30             # lifting cap per session
  kettlebell_min: 15

types: [Heavy, Compound-acc, Isolation]

days:
  # key, weekday (0 = Sun), label
  - [P1, 0, "Push 1"]
  - [PU1, 1, "Pull 1"]
  - [L1, 2, "Legs 1"]
  - [P2, 3, "Push 2"]
  - [PU2, 4, "Pull 2"]
  - [L2, 5, "Legs 2"]

# Blocks rotate D -> E -> F -> D, six weeks each (Config!B20 = the week v2 starts).
# Each exercise: [name, type, sets, rep_low, rep_high, increment_lb, equipment, muscle, video_url]
# Order on the day = 1A, 1B, 2A, 2B, 3A, 3B. Region is implied by the day (P/PU = Upper, L = Legs).
# muscle is used by scripts/recalc.py to map InBody body parts to exercises.
